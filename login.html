<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Girls NGO Login</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ff9ec4,#ffd6e8);
    }

    .login-container{
        background:white;
        width:350px;
        padding:30px;
        border-radius:15px;
        box-shadow:0 4px 15px rgba(0,0,0,0.2);
        text-align:center;
    }

    .login-container h1{
        color:#d63384;
        margin-bottom:10px;
    }

    .login-container p{
        color:#666;
        margin-bottom:20px;
    }

    .input-group{
        margin-bottom:15px;
        text-align:left;
    }

    .input-group label{
        display:block;
        margin-bottom:5px;
        color:#444;
    }

    .input-group input{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:8px;
        outline:none;
    }

    .input-group input:focus{
        border-color:#d63384;
    }

    .login-btn{
        width:100%;
        padding:12px;
        background:#d63384;
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:16px;
    }

    .login-btn:hover{
        background:#b8256d;
    }

    .footer-text{
        margin-top:15px;
        font-size:14px;
        color:#666;
    }

    .footer-text a{
        color:#d63384;
        text-decoration:none;
    }
</style>
</head>

<body>

<div class="login-container">
    <h1>Girls NGO</h1>
    <p>Empowering Women, Building Futures</p>

    <form>
        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="footer-text">
        New Member? <a href="#">Register Here</a>
    </div>
</div>

</body>
</html>
